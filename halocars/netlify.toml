# Halo Autos — Netlify config.
# This file MUST sit at the root of the GitHub repo, next to build.js and package.json.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Generated photo filenames contain a content hash, so they can cache forever.
[[headers]]
  for = "/cars/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The inventory must never be stale — this is what makes new cars appear instantly.
[[headers]]
  for = "/data/inventory.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
